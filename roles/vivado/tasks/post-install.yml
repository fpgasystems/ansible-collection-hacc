---

- name: Add vivado dir in modulefiles dir
  ansible.builtin.file:
    path: /usr/share/modules/modulefiles/vivado
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Generate modulefiles from template
  ansible.builtin.template:
    src: modulefile.j2
    dest: "/usr/share/modules/modulefiles/vivado/{{ release }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ installed_releases | map(attribute='release') | list }}"
  loop_control:
    loop_var: release

- name: Create startup script for login-shells
  ansible.builtin.copy:
    dest: /etc/profile.d/vivado.sh
    content: |
      export XILINXD_LICENSE_FILE={{ vivado_license_servers | join(':') }}
      {% if installed_releases | length == 1 %}
      load_vivado() {
        if ! type module >/dev/null 2>&1; then
          source /etc/profile.d/modules.sh
        fi
        module load vivado/{{ (installed_releases | first).release }}
      }
      load_vivado
      {% endif %}
    owner: root
    group: root
    mode: '0755'

- name: Set startup script to system bashrc for non-login shells
  ansible.builtin.lineinfile:
    path: /etc/bash.bashrc
    line: 'source /etc/profile.d/vivado.sh'
    state: present
